name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio
            (Tetris en JavaScript vanilla, lógica en game.js — ver CLAUDE.md para la arquitectura).

            Pasos:
            1. Lee el título y cuerpo del issue con `gh issue view ${{ github.event.issue.number }}`.
            2. Determina qué labels de este set aplican (puede ser más de uno):
               bug, enhancement, question, documentation, ui-rendering, gameplay-logic, input-controls, scoring.
               Si un label del set no existe todavía en el repo, créalo primero con `gh label create`.
               Aplica los labels con `gh issue edit ${{ github.event.issue.number }} --add-label "..."`.
               Si el issue ya tiene labels de este mismo set que ya no aplican tras la edición, quítalos con `--remove-label`.
            3. Publica (o actualiza si ya existe un comentario previo tuyo) un comentario en el issue con un diagnóstico general:
               - Causa probable del problema.
               - Funciones/archivos de game.js (o index.html/style.css) probablemente involucrados, citando nombres de función reales del código.
               - Complejidad estimada (baja/media/alta) y qué se necesitaría para implementar la solución.
               No escribas el código de la solución, solo el diagnóstico.
               El comentario debe estar escrito en formato Markdown válido para GitHub (encabezados con `#`, listas con `-`, `código` o nombres de función entre backticks, bloques de código con ``` si hace falta), para que se renderice correctamente en la UI de issues.
          claude_args: |
            --allowed-tools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh label create:*),Bash(gh api:*)"
